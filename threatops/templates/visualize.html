<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualize Logs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
        /* Limit chart container size for pie/doughnut */
        .chart-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .chart-wrapper {
            position: relative;
            width: 100%;
            max-height: 500px;
        }
    </style>
</head>
<body class="role-bg-{{ session.role.lower() if session.role else 'analyst' }}">
    {% include 'navbar.html' %}

    <main class="container my-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <h2>Threat Visualization</h2>
        <div class="row g-3 align-items-end mb-4">
            <div class="col-md-4">
                <label class="form-label">Select Data Field</label>
                <select id="chart-field" class="form-select">
                    <option value="severity">Log Severity</option>
                    <option value="protocol">Network Protocol</option>
                    <option value="technique">MITRE ATT&CK Technique</option>
                    <option value="alert_type">Alert Type</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Chart Type</label>
                <select id="chart-type" class="form-select">
                    <option value="bar">Bar Chart</option>
                    <option value="pie">Pie Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="doughnut">Doughnut Chart</option>
                </select>
            </div>
            <div class="col-md-4">
                <button id="generate-chart" class="btn btn-primary w-100">Generate Chart</button>
            </div>
        </div>

        <div class="card chart-container mt-4">
            <div class="card-body">
                <div class="chart-wrapper">
                    <canvas id="log-chart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
