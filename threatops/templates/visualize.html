<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualize Logs</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">ThreatOps SIEM</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/upload">Upload CSV</a>
                <a class="nav-link" href="/sql_panel">SQL Panel</a>
                <a class="nav-link" href="/visualize">Visualize</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h2>Visualization Module</h2>
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Select Field</label>
                <select id="chart-field" class="form-select">
                    <option value="attack_type">Attack Type</option>
                    <option value="protocol">Protocol</option>
                    <option value="source_ip">Source IP</option>
                    <option value="mitre_attack_id">MITRE ATT&amp;CK ID</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Chart Type</label>
                <select id="chart-type" class="form-select">
                    <option value="bar">Bar Chart</option>
                    <option value="pie">Pie Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="doughnut">Doughnut Chart</option>
                    <option value="stackedBar">Stacked Bar Chart</option>
                </select>
            </div>
            <div class="col-md-4">
                <button id="generate-chart" class="btn btn-primary w-100">Generate Chart</button>
            </div>
        </div>

        <div class="chart-container mt-4">
            <canvas id="log-chart"></canvas>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
