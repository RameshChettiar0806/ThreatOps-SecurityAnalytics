<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Query Panel</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">ThreatOps SIEM</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/upload">Upload CSV</a>
                <a class="nav-link" href="/sql_panel">SQL Panel</a>
                <a class="nav-link" href="/visualize">Visualize</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <h2>SQL Query Panel</h2>
        <p class="text-muted">
            Run SELECT queries against the ThreatOps database. Example:
            <code>SELECT * FROM logs WHERE protocol='TCP' LIMIT 10</code>
        </p>

        <div class="card p-4 shadow-sm">
            <label for="sql-query" class="form-label">SQL Query</label>
            <textarea id="sql-query" class="form-control" rows="4"></textarea>
            <button id="run-query" class="btn btn-primary mt-3">Execute Query</button>
            <div id="query-message" class="mt-3"></div>
        </div>

        <div class="table-responsive mt-4">
            <table class="table table-bordered" id="query-results">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
